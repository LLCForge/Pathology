[package]
name = "pathology"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "BGP route monitor for your own routers: BMP and passive BGP collector, learned baselines, deviation alerts"
license = "MIT"
repository = "https://github.com/LLCForge/Pathology"
authors = ["LLCForge contributors"]
readme = "README.md"
keywords = ["bgp", "bmp", "monitoring", "network", "routing"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ipnet = { version = "2", features = ["serde"] }
llcforge-beacon = { path = "crates/llcforge-beacon", version = "0.1" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "1.2"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "LLCForge contributors <https://github.com/LLCForge/Pathology>"
copyright = "2026, LLCForge contributors"
license-file = ["LICENSE", "0"]
extended-description = "BGP route monitor for your own routers: BMP and passive BGP collector, learned baselines, deviation alerts"
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/pathology", "usr/bin/", "755"],
    ["pathology.example.toml", "etc/pathology/pathology.toml", "644"],
    ["README.md", "usr/share/doc/pathology/README.md", "644"],
    ["NOTICE", "usr/share/doc/pathology/NOTICE", "644"],
]
conf-files = ["/etc/pathology/pathology.toml"]
# Installs packaging/systemd/pathology.service and the matching maintainer scripts;
# the unit is not enabled automatically (configure first, then enable).
systemd-units = { unit-name = "pathology", unit-scripts = "packaging/systemd", enable = false, start = false }

[package.metadata.generate-rpm]
license = "MIT"
summary = "BGP route monitor for your own routers: BMP and passive BGP collector, learned baselines, deviation alerts"
assets = [
    { source = "target/release/pathology", dest = "/usr/bin/pathology", mode = "755" },
    { source = "packaging/systemd/pathology.service", dest = "/usr/lib/systemd/system/pathology.service", mode = "644" },
    { source = "pathology.example.toml", dest = "/etc/pathology/pathology.toml", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/pathology/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/pathology/LICENSE", mode = "644", doc = true },
]
post_install_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
